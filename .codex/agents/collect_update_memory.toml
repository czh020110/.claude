- [架构或技术选型上的硬性限制，不能违反的设计规则]

## 禁止事项

- [明确不能做的事情，不能采用的设计]

## 成功标准

- [ ] [可验证的完成标准]

## 质量底线

- 测试底线：[要求]
- 安全底线：[要求]
