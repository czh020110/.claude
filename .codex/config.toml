# Codex project-level config
tools.update_plan.enabled = true

# AGENTS.md already contains project memory, collaboration rules and all project rules; the default 32 KiB cap is too tight
project_doc_max_bytes = 65536

# Sub-agent concurrency cap (max_threads is a compatible alias, usable on 0.144.x and newer)
[agents]
max_concurrent_threads_per_session = 4

[features]
default_mode_request_user_input = true    # Interactive question tool (request_user_input); the user can enable it as needed
undo = true                               # Change undo and rollback

[features.multi_agent_v2]
enabled = true
tool_namespace = "agents"
